services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/database.sqlite
    volumes:
      - laravel_storage:/app/storage
      - ./app:/app/app:ro
      - ./routes:/app/routes:ro
      - ./resources:/app/resources:ro
      - ./public/articles.json:/app/storage/app/public/articles.json:ro

volumes:
  laravel_storage:
